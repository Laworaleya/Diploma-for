version: '3.8'

# MongoDB removed — using MongoDB Atlas (cloud)
# Set MONGODB_URI in .env to your Atlas connection string

services:
  redis:
    image: redis:7-alpine
    container_name: finlit_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_secret_2026
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
